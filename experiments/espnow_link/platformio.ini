[platformio]
default_envs = link_rx, link_tx

[radio_base]
platform = espressif32@6.9.0
framework = arduino
platform_packages = framework-arduinoespressif32@3.20017.0
monitor_speed = 115200
monitor_eol = LF
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
extra_scripts = pre:test/build_meta.py

[env:link_tx]
extends = radio_base
board = esp32dev
upload_speed = 57600
build_flags = -DLINK_TX=1
build_src_filter = +<link_protocol.cpp> +<radio.cpp> +<tx.cpp>

[env:link_rx]
extends = radio_base
board = seeed_xiao_esp32c3
upload_speed = 115200
build_flags = -DLINK_RX=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<link_protocol.cpp> +<radio.cpp> +<rx.cpp>

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.0
test_build_src = yes
build_flags = -std=c++11 -DLINK_USE_UNITY
build_src_filter = +<link_protocol.cpp>
